[platformio]
default_envs = beacon_s3

; NimBLE-Arduino 2.x requires Arduino-ESP32 3.x (IDF v5).
; espressif32 platform 6.x bundles Arduino-ESP32 3.x and is installed
; independently from the WLED project's older platform version.

[env:beacon_s3]
platform      = espressif32@^6.9.0
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
lib_deps      =
    h2zero/NimBLE-Arduino@^2.2.3
    fastled/FastLED@^3.9.0
build_flags   =
    -DCONFIG_BT_NIMBLE_EXT_ADV=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:beacon_c3]
platform      = espressif32@^6.9.0
board         = esp32-c3-devkitm-1
framework     = arduino
monitor_speed = 115200
lib_deps      =
    h2zero/NimBLE-Arduino@^2.2.3
    fastled/FastLED@^3.9.0
build_flags   =
    -DCONFIG_BT_NIMBLE_EXT_ADV=1
    -DARDUINO_USB_CDC_ON_BOOT=1
