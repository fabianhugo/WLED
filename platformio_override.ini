; Local overrides for building a provisioning filesystem image.
; This file is gitignored. See docs/claude-factory-provisioning.md

[platformio]
; point the filesystem image at our provisioning files instead of the web UI sources
data_dir = fsdata

[env:esp32c3dev_qio]
extends = env:esp32c3dev
build_flags = ${common.build_flags} ${esp32c3.build_flags} -D WLED_RELEASE_NAME=\"ESP32-C3-QIO\"
board_build.flash_mode = qio
; the espressif32 platform defaults to spiffs; WLED uses LittleFS
board_build.filesystem = littlefs
